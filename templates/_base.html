<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Count-Back{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <!-- Nav strip -->
    <nav class="navbar">
        <button class="nav-btn" id="menu-btn" aria-label="Menu">☰</button>
        <span class="mode-badge" id="mode-badge">{{ mode | default('') }}</span>
        <label class="hint-toggle">
            💡 <input type="checkbox" id="hint-switch">
        </label>
    </nav>

    <!-- Hamburger slide-out overlay -->
    <div class="overlay hidden" id="menu-overlay">
        <div class="drawer-menu">
            <div class="menu-section">Mode</div>
            <button class="menu-item" data-mode="simulation">🎲 Simulation</button>
            <button class="menu-item" data-mode="learning">🎓 Learning</button>
            <div class="menu-separator"></div>
            <button class="menu-item" id="menu-home">🏠 Main Menu</button>
        </div>
    </div>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
