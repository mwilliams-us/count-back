<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Count-Back{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        /* Navbar controls beyond app.css */
        .mode-toggle { display: flex; border: 1px solid #4a4a55;
                       border-radius: 999px; overflow: hidden; }
        .mode-toggle button { background: none; border: none; color: #aaa;
                              padding: .25rem .9rem; font-size: .8rem;
                              cursor: pointer; }
        .mode-toggle button.active { background: #6d4aff; color: #fff; }
        .reset-btn { background: none; border: 1px solid #4a4a55; color: #fff;
                     border-radius: 999px; padding: .25rem .9rem;
                     font-size: .8rem; cursor: pointer; }
        .reset-btn:active { background: #4a4a55; }
        .spacer { flex: 1; }
    </style>
</head>
<body>
    <!-- Nav strip: Sim/Learn toggle · hint switch · reset -->
    <nav class="navbar">
        <div class="mode-toggle" id="mode-toggle">
            <button data-mode="simulation" id="btn-sim">🎲 Sim</button>
            <button data-mode="learning" id="btn-learn">🎓 Learn</button>
        </div>
        <div class="spacer"></div>
        <label class="hint-toggle">
            💡 <input type="checkbox" id="hint-switch">
        </label>
        <button class="reset-btn" id="reset-btn">↺ Reset</button>
    </nav>

    {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
